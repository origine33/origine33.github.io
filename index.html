<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Nexus</title>
  <meta name="description" content="Ask Nexus anything about Joseph Diaz." />
  <meta name="theme-color" content="#f7f9fc" />
  <meta property="og:title" content="Nexus" />
  <meta property="og:description" content="Ask Nexus anything about Joseph Diaz." />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/assets/css/nexus.css" />
  <link rel="preconnect" href="https://app.spline.design" />
</head>
<body>

  <div class="hero-top">
    <h1 class="eyebrow">Nexus</h1>
    <p class="subline">An AI interface into <strong>Joseph Diaz</strong>'s work. Ask about his projects, his skills, or the homelab he runs.</p>

    <form class="ask-form" data-ask-form>
      <input
        class="ask-input"
        type="text"
        name="question"
        data-ask-input
        placeholder="Ask Nexus…"
        autocomplete="off"
        maxlength="200"
      />
      <button class="ask-submit" type="submit">Ask</button>
    </form>

    <div class="chips">
      <button type="button" class="chip" data-chip>Where does Joseph work?</button>
      <button type="button" class="chip" data-chip>What is the homelab?</button>
      <button type="button" class="chip" data-chip>How can I reach him?</button>
    </div>

    <p class="output" data-ask-output></p>
  </div>

  <div class="bot-stage">
    <iframe
      class="bot-embed"
      data-bot-embed
      data-src="https://app.spline.design/file/55efb9cc-d2fe-4ef3-ac87-ae125b52155b?view=preview"
      title=""
      loading="lazy"
      aria-hidden="true"
      tabindex="-1"
    ></iframe>
    <img
      class="bot-fallback"
      data-bot-fallback
      src="/assets/img/nexbot-fallback.jpg"
      alt=""
      aria-hidden="true"
    />
  </div>

  <div class="gate-links">
    <a href="/portfolio.html">view the portfolio →</a>
  </div>

  <script src="/assets/js/nexus.js"></script>
  <script src="/assets/js/analytics.js"></script>
</body>
</html>
